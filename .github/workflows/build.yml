name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: node test/widget.browser.cjs
        env:
          CONCH_BROWSER: webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-previews
          path: test-results/*.png
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-14
            platform: macos-universal
            target: universal-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build:frontend
      - name: Resolve Rust dependencies
        shell: bash
        run: if [ ! -f src-tauri/Cargo.lock ]; then cargo generate-lockfile --manifest-path src-tauri/Cargo.toml; fi
      - name: Rust checks
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native app
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Package portable Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/release -Force | Out-Null
          Copy-Item 'src-tauri/target/x86_64-pc-windows-msvc/release/magic-conch-widget.exe' 'dist/release/Magic-Conch-0.2.0-Windows.exe'
      - name: Check Windows app
        if: runner.os == 'Windows'
        run: npm run test:native
        env:
          CONCH_EXECUTABLE: dist/release/Magic-Conch-0.2.0-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            dist/release/*.exe
            src-tauri/Cargo.lock
