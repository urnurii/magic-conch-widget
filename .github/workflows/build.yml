name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - run: node test/widget.browser.cjs
        env:
          CONCH_BROWSER: webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-previews
          path: test-results/*.png
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-14
            platform: macos-universal
            target: universal-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm run build:frontend
      - name: Resolve Rust dependencies
        shell: bash
        run: if [ ! -f src-tauri/Cargo.lock ]; then cargo generate-lockfile --manifest-path src-tauri/Cargo.toml; fi
      - name: Rust checks
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build native app
        run: npm run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Package portable Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/release -Force | Out-Null
          Copy-Item 'src-tauri/target/x86_64-pc-windows-msvc/release/magic-conch-widget.exe' 'dist/release/Magic-Conch-0.2.0-Windows.exe'
      - name: Ensure WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtimeKeys = @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}', 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}')
          $installed = $runtimeKeys | Where-Object { (Get-ItemProperty -LiteralPath $_ -Name pv -ErrorAction SilentlyContinue).pv }
          if (-not $installed) {
            $installer = Join-Path $env:RUNNER_TEMP 'WebView2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $process = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -Wait -WindowStyle Hidden -PassThru
            if ($process.ExitCode -ne 0) { throw "WebView2 install failed: $($process.ExitCode)" }
          }
          npm run tauri -- info
      - name: Check Windows startup
        if: runner.os == 'Windows'
        run: node test/widget.startup.cjs
        env:
          CONCH_EXECUTABLE: dist/release/Magic-Conch-0.2.0-Windows.exe
      - name: Check macOS app
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict 'src-tauri/target/universal-apple-darwin/release/bundle/macos/Magic Conch.app'
          lipo -archs 'src-tauri/target/universal-apple-darwin/release/bundle/macos/Magic Conch.app/Contents/MacOS/magic-conch-widget'
          node test/widget.startup.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            dist/release/*.exe
            src-tauri/Cargo.lock
