<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Волшебная ракушка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="widget" aria-label="Волшебная ракушка">
    <header class="nameplate"><span class="star">✦</span> ВОЛШЕБНАЯ РАКУШКА <span class="star">✦</span></header>
    <div class="bubble" id="bubble" role="status" aria-live="polite">
      <span class="eyebrow" id="eyebrow">СПРОСИ У РАКУШКИ</span>
      <span id="answer">Что ты хочешь узнать?</span>
    </div>
    <section class="stage" aria-label="Нажми на ракушку или потяни колечко вверх">
      <span class="spark spark-one" aria-hidden="true">✦</span>
      <span class="spark spark-two" aria-hidden="true">✧</span>
      <span class="spark spark-three" aria-hidden="true">·</span>
      <button id="shell" class="shell" aria-label="Спросить волшебную ракушку" title="Задай вопрос мысленно и нажми">
        <img src="../assets/magic-conch.png" alt="Magic Conch Shell из Губки Боба" draggable="false">
      </button>
      <svg class="cord" viewBox="0 0 390 330" aria-hidden="true">
        <path id="cord-outline" d="M 255 147 Q 279 135 294 82"/>
        <path id="cord-core" d="M 255 147 Q 279 135 294 82"/>
      </svg>
      <button id="ring" class="ring" aria-label="Потянуть колечко; можно также нажать Enter" title="Потяни вверх и отпусти"><span></span></button>
      <span class="pull-hint" id="pull-hint">↑ потяни</span>
    </section>
    <p class="hint" id="hint">Задай вопрос. Доверься ракушке.</p>
    <nav class="toolbar" aria-label="Управление виджетом">
      <div class="grip" title="Перетащи виджет за эту область" aria-label="Область перемещения"><span>⠿</span></div>
      <button id="sound" aria-label="Озвучка" aria-pressed="true" title="Звуки и голос Windows">♫</button>
      <button id="pin" aria-label="Поверх других окон" aria-pressed="true" title="Поверх других окон">⌖</button>
      <span class="divider"></span>
      <button id="minimize" aria-label="Свернуть" title="Свернуть">−</button>
      <button id="close" aria-label="Закрыть" title="Закрыть">×</button>
    </nav>
  </main>
  <script src="answers.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
